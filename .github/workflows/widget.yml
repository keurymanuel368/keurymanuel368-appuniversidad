# Compila el widget de Android cada vez que cambias algo en la carpeta widget/
# y deja el APK nuevo en public/rumbo-widget.apk (Cloudflare lo publica solo).
# Usa el Java y el Android SDK que ya trae la máquina de GitHub: menos pasos, menos fallos.
name: Widget de Android

on:
  push:
    branches: [main]
    paths: ['widget/**', '.github/workflows/widget.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Preparar Java 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          "$JAVA_HOME_17_X64/bin/java" -version

      - name: Preparar Gradle 8.10.2
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Preparar Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > widget/local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true

      - name: Compilar APK
        working-directory: widget
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Guardar el APK en public/
        run: |
          cp widget/app/build/outputs/apk/release/app-release.apk public/rumbo-widget.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898315+github-actions[bot]@users.noreply.github.com"
          git add public/rumbo-widget.apk
          git commit -m "Widget: APK compilado automáticamente" || echo "Sin cambios en el APK"
          git push
