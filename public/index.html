    <title>Rumbo</title>
    <script>try{var t=localStorage.getItem("rumbo-theme")||"auto";if(t==="dark"||(t==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.setAttribute("data-mode","dark")}catch(e){}</script>
    <style>
      .boot{--b1:#2F7BFF;--b2:#7A5CFF;--b3:#22C3EE;position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;background:#F5F5F7;color:#1D1D1F;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;opacity:0;animation:bt-fade .4s cubic-bezier(.32,.72,0,1) .12s forwards;transition:opacity .5s cubic-bezier(.32,.72,0,1)}
      :root[data-mode=dark] .boot{background:#000;color:#F5F5F7}
      .bt-aura i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(60px);opacity:.38;mix-blend-mode:multiply;animation:bt-drift 9s ease-in-out infinite alternate}
      :root[data-mode=dark] .bt-aura i{mix-blend-mode:screen;opacity:.33}
      .bt-aura i:nth-child(1){background:var(--b1);left:-28vmax;top:-30vmax}
      .bt-aura i:nth-child(2){background:var(--b2);right:-30vmax;top:-8vmax;animation-delay:-3s;animation-duration:11s}
      .bt-aura i:nth-child(3){background:var(--b3);left:-10vmax;bottom:-38vmax;animation-delay:-6s;animation-duration:13s}
      .bt-c{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;transition:transform .6s cubic-bezier(.32,.72,0,1),filter .5s,opacity .45s}
      .bt-logo{width:96px;height:96px;border-radius:26px;box-shadow:0 22px 44px -14px rgba(10,92,224,.55),0 2px 6px rgba(10,92,224,.25);transform:scale(.6);opacity:0;animation:bt-pop .9s cubic-bezier(.34,1.56,.64,1) .15s forwards;position:relative}
      .bt-logo:after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:250% 100%;background-position:120% 0;animation:bt-shine 2.6s ease-in-out 1s infinite}
      .bt-logo svg{display:block;width:100%;height:100%}
      .bt-ring{stroke-dasharray:100;stroke-dashoffset:100;animation:bt-draw .9s cubic-bezier(.65,0,.35,1) .3s forwards}
      .bt-needle{transform-origin:48px 48px;transform:rotate(-200deg);opacity:0;animation:bt-needle 1.3s cubic-bezier(.34,1.56,.64,1) .55s forwards,bt-wobble 2.8s ease-in-out 2s infinite}
      .bt-word{margin-top:22px;font-size:34px;font-weight:700;letter-spacing:-.035em;display:flex}
      .bt-word span{display:inline-block;opacity:0;transform:translateY(14px);filter:blur(6px);animation:bt-up .7s cubic-bezier(.32,.72,0,1) forwards}
      .bt-hi{margin-top:6px;font-size:16px;font-weight:500;color:#6E6E73;opacity:0;animation:bt-up .7s cubic-bezier(.32,.72,0,1) .85s forwards;transform:translateY(10px)}
      :root[data-mode=dark] .bt-hi{color:#A1A1A6}
      .bt-tip{margin-top:30px;height:20px;overflow:hidden;font-size:13px;font-weight:500;color:#8E8E93;opacity:0;animation:bt-fade .5s ease 1.1s forwards}
      .bt-tip div{animation:bt-tick 4.8s cubic-bezier(.65,0,.35,1) 1.6s infinite}
      .bt-tip span{display:block;height:20px;line-height:20px}
      .bt-bar{position:absolute;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));width:140px;height:4px;margin-left:-70px;border-radius:4px;background:rgba(120,120,128,.16);overflow:hidden;opacity:0;animation:bt-fade .4s ease 1s forwards}
      .bt-bar i{position:absolute;top:0;bottom:0;left:0;width:45%;border-radius:4px;background:linear-gradient(90deg,var(--b3),var(--b1),var(--b2));animation:bt-slide 1.25s cubic-bezier(.65,0,.35,1) infinite;transition:width .35s cubic-bezier(.32,.72,0,1)}
      .bt-foot{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:11px;font-weight:600;letter-spacing:.18em;color:#AEAEB2;opacity:0;animation:bt-fade .5s ease 1.2s forwards}
      .boot.done .bt-bar i{animation:none;width:100%;transform:none}
      .boot.out{opacity:0!important;pointer-events:none}
      .boot.out .bt-c{transform:scale(1.12);filter:blur(10px);opacity:0}
      @keyframes bt-fade{to{opacity:1}} @keyframes bt-pop{to{transform:none;opacity:1}} @keyframes bt-draw{to{stroke-dashoffset:0}}
      @keyframes bt-needle{0%{opacity:0}15%{opacity:1}to{transform:rotate(0);opacity:1}}
      @keyframes bt-wobble{0%,100%{transform:rotate(0)}30%{transform:rotate(14deg)}60%{transform:rotate(-6deg)}}
      @keyframes bt-up{to{opacity:1;transform:none;filter:none}}
      @keyframes bt-shine{0%{background-position:120% 0}45%,100%{background-position:-20% 0}}
      @keyframes bt-slide{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}
      @keyframes bt-tick{0%,22%{transform:none}33%,55%{transform:translateY(-20px)}66%,88%{transform:translateY(-40px)}100%{transform:translateY(-60px)}}
      @keyframes bt-drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
      @media (prefers-reduced-motion:reduce){.boot *,.boot{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important}}
    </style>

  <body>
    <div id="root"></div>
    <div id="boot" class="boot" role="status" aria-label="Cargando Rumbo">
      <div class="bt-aura"><i></i><i></i><i></i></div>
      <div class="bt-c">
        <div class="bt-logo"><svg viewBox="0 0 96 96" aria-hidden="true"><defs><linearGradient id="btg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5AA2FF"/><stop offset=".55" stop-color="#1F6FFF"/><stop offset="1" stop-color="#0A4FD0"/></linearGradient></defs><rect width="96" height="96" rx="26" fill="url(#btg)"/><circle cx="48" cy="48" r="27" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="5"/><circle class="bt-ring" cx="48" cy="48" r="27" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" pathLength="100" transform="rotate(-90 48 48)"/><g class="bt-needle"><path d="M61 35 53.6 53.6 35 61 42.4 42.4Z" fill="#fff"/><path d="M61 35 53.6 53.6 48 48Z" fill="rgba(10,79,208,.28)"/><circle cx="48" cy="48" r="3" fill="#1F6FFF"/></g></svg></div>
        <div class="bt-word" aria-hidden="true"><span style="animation-delay:.45s">R</span><span style="animation-delay:.5s">u</span><span style="animation-delay:.55s">m</span><span style="animation-delay:.6s">b</span><span style="animation-delay:.65s">o</span></div>
        <div class="bt-hi" id="bt-hi">Tu rumbo en la universidad</div>
        <div class="bt-tip"><div><span>Preparando tu día…</span><span>Revisando tus entregas…</span><span>Calculando tu índice…</span><span>Preparando tu día…</span></div></div>
      </div>
      <div class="bt-bar"><i></i></div>
      <div class="bt-foot">BY DEXA</div>
    </div>
    <script>try{var h=new Date().getHours(),n=(localStorage.getItem("rumbo-name")||"").trim(),g=h<12?"Buenos días":h<19?"Buenas tardes":"Buenas noches";document.getElementById("bt-hi").textContent=g+(n?", "+n:"")+" 👋"}catch(e){}</script>
