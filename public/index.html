    <title>Rumbo</title>
    <script>try{var t=localStorage.getItem("rumbo-theme")||"auto";if(t==="dark"||(t==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.setAttribute("data-mode","dark")}catch(e){}</script>
    <style>
      .boot{position:fixed;inset:0;transition:opacity .35s cubic-bezier(.32,.72,0,1),transform .45s cubic-bezier(.32,.72,0,1);display:grid;place-items:center;background:#F5F5F7;z-index:9999;opacity:0;animation:boot-in .35s cubic-bezier(.32,.72,0,1) .25s forwards}
      :root[data-mode=dark] .boot{background:#000}
      .boot-in{display:flex;flex-direction:column;align-items:center;gap:14px;transform:scale(.96);animation:boot-pop .6s cubic-bezier(.32,.72,0,1) .25s forwards}
      .boot img{width:88px;height:88px;border-radius:22px;box-shadow:0 10px 30px -8px rgba(0,113,227,.45)}
      .boot b{font:700 22px -apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif;letter-spacing:-.02em;color:#1D1D1F}
      :root[data-mode=dark] .boot b{color:#F5F5F7}
      .boot-spin{position:relative;width:22px;height:22px;margin-top:18px;animation:boot-rot .8s steps(8) infinite}
      .boot-spin i{position:absolute;left:10px;top:1px;width:2.4px;height:6px;border-radius:2px;background:#8E8E93;transform-origin:1.2px 10px}
      .boot.out{opacity:0!important;transform:scale(1.04);pointer-events:none}
      @keyframes boot-in{to{opacity:1}} @keyframes boot-pop{to{transform:none}} @keyframes boot-rot{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){.boot,.boot-in{animation-duration:.01ms}.boot-spin{animation:none}}
    </style>
