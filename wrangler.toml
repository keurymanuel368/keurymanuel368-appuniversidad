# Rumbo · configuración de Cloudflare Workers
# Cloudflare publica con este archivo cada vez que guardas un cambio en GitHub.

name = "rumbo"
main = "src/index.js"
compatibility_date = "2025-09-01"
# Mantiene las variables que ya tienes en el panel de Cloudflare (no las borra al publicar).
keep_vars = true

# La app (páginas, estilos, íconos, APK del widget)
[assets]
directory = "./public"
not_found_handling = "single-page-application"
# Estas direcciones las atiende el servidor (API, guía de Telegram, llaves y descarga de la app).
run_worker_first = ["/api/*", "/telegram", "/llaves", "/exportar"]

# Base de datos D1 "rumbo-db"
[[d1_databases]]
binding = "DB"
database_name = "rumbo-db"
database_id = "4ebcd232-495b-4893-8bd6-0fe9a3f516dc"

# Copias de seguridad (KV)
[[kv_namespaces]]
binding = "BACKUPS"
id = "ae58212e218447b9bee6016159d31556"

# Workers AI (voz y respaldo de la IA)
[ai]
binding = "AI"

[vars]
APP_URL = "https://rumbo.gestori.workers.dev"
MOODLE_URL = "https://eva.uapa.edu.do"
TZ_OFFSET_HOURS = "-4"

# Las tareas programadas (Cron) no se tocan: se quedan como están en Cloudflare.
# Los secretos tampoco van aquí: siguen en Cloudflare o los pones desde la app en /llaves.
